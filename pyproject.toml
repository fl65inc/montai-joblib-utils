[project]
name = "montai-joblib-utils-ai-mcp"
version = "0.1.0"
description = "Montai joblib utils — search existing Lambda / Batch / SageMaker compute (Strands + FastMCP)"
readme = "README.md"
authors = [
    { name = "Jillian Rowe", email = "jillian.e.rowe@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "strands-agents>=1.47.0",
    "mcp>=1.28.1",
    "boto3>=1.43.0",
    "pydantic>=2.0",
    "fastapi>=0.139.2",
    "uvicorn[standard]>=0.51.0",
    "aws-opentelemetry-distro>=0.10.0",
]

[project.optional-dependencies]
anthropic = ["strands-agents[anthropic]"]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy", "moto[awslambda,batch,sagemaker]"]

[project.scripts]
montai-joblib-utils-mcp = "montai_joblib_utils_ai_mcp.server:main"
montai-joblib-utils-agent = "montai_joblib_utils_ai_mcp.agent:main"
montai-joblib-utils-api = "montai_joblib_utils_ai_mcp.api:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
markers = [
    "usage: live AWS usage tests against matrix properties (slow)",
]
addopts = "-m 'not usage'"
